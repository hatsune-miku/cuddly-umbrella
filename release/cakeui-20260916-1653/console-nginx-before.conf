map $http_x_forwarded_proto $cuddly_forwarded_proto {
  default $http_x_forwarded_proto;
  '' $scheme;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream cuddly_control_api {
  zone cuddly_control_api 64k;
  server control-api:9880 resolve;
}

server {
  listen 80;
  server_name _;

  location ~* ^/api/v1/internal(?:/|$) {
    return 404;
  }

  location /api/ {
    proxy_pass http://cuddly_control_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $cuddly_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /help {
    absolute_redirect off;
    return 308 /help/;
  }

  location ^~ /help/ {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
  }

  location = /pc-plugin {
    return 308 /pc-plugin/;
  }

  location = /pc-plugin/ {
    root /usr/share/nginx/html;
    try_files /pc-plugin/index.html =404;
    add_header Cache-Control "no-cache";
  }

  location ^~ /pc-plugin/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
